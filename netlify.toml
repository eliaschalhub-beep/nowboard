[build]
  publish = "."

[[edge_functions]]
  path = "/*"
  function = "gate"

[[edge_functions]]
  path = "/refresh"
  function = "refresh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
